<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_uhh AI - Maintenance Mode</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 4s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#0c1017] text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 overflow-hidden relative">

    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1f293d15_1px,transparent_1px),linear-gradient(to_bottom,#1f293d15_1px,transparent_1px)] bg-[size:3rem_3rem] pointer-events-none"></div>
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-lg z-10">
        <div class="bg-[#121824]/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 text-center relative overflow-hidden animate-pulse-slow">
            
            <!-- Top badge mimicking the app header -->
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800/80">
                <div class="flex items-center space-x-2">
                    <span class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-xs font-bold px-2.5 py-1 rounded-lg mono-font">_uhh</span>
                    <span class="text-xs text-slate-400 font-medium">AI Assistant</span>
                </div>
                <div class="flex items-center space-x-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
                    <span class="text-xs text-amber-400 font-mono font-semibold">MAINTENANCE</span>
                </div>
            </div>

            <!-- Animated Icon -->
            <div class="mb-6 flex justify-center">
                <div class="w-20 h-20 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-3xl shadow-lg animate-float">
                    ⚠️
                </div>
            </div>

            <!-- Main Error Header -->
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-3">
                OPPSIE!
            </h1>

            <!-- Message body -->
            <p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-6 px-2">
                <span class="font-mono text-indigo-400 font-bold">_uhh</span> is undergoing maintenance with a response error right now. We'll be back shortly.
            </p>

            <!-- Timestamp Box -->
            <div class="bg-[#1a2234] border border-slate-800 rounded-2xl p-4 mb-6 text-left space-y-1.5">
                <div class="flex items-center justify-between text-xs text-slate-400 font-mono">
                    <span>INCIDENT CODE:</span>
                    <span class="text-slate-200">ERR_RESPONSE_FAILURE</span>
                </div>
                <div class="flex items-center justify-between text-xs text-slate-400 font-mono">
                    <span>DOWN SINCE:</span>
                    <span class="text-amber-400 font-bold">Sep 7, 2026 at 9:13</span>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="space-y-3">
                <a href="https://thesigma782-byte.github.io/Plunger_teams-about/" target="_blank" rel="noopener noreferrer" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] transition-all duration-200 rounded-xl font-semibold text-sm text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    <span>Check our website pls</span>
                </a>
            </div>

        </div>
    </main>

    <script>
        // System status refresh handler
    </script>
</body>
</html>
